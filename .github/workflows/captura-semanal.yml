name: Captura semanal del mercado

# Cada lunes lee las fuentes, actualiza la base y regenera la página en la rama v2-prueba.
on:
  schedule:
    - cron: "17 13 * * 1"   # lunes 7:17 a. m. hora del centro de México
  workflow_dispatch:         # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-prueba
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer fuentes
        run: python3 -m recolectar
      - name: Homologar y generar la página
        run: |
          python3 homologar.py
          python3 build.py
      - name: Guardar la captura
        run: |
          git config user.name "captura-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data site index.html
          git commit -m "Captura semanal $(date +%F)" || echo "Sin cambios"
          git push

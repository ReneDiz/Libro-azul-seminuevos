<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valuador de tractocamiones</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--sf2:#faf8f4;--tx:#1b2a41;--mu:#5a6478;--fa:#8b93a3;--bd:#e2ddd2;--ac:#24507a;--ac-s:rgba(36,80,122,.10);--au:#b8892c;--au-s:rgba(198,154,60,.16);--ok:#1f7a49;--ok-s:#e6f4ec;--wr:#a65a0b;--wr-s:#fdf1e2;--bad:#b42318;--bad-s:#fdecea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--sf:#1d232c;--sf2:#222a35;--tx:#e9edf3;--mu:#a4adbb;--fa:#7d8796;--bd:#323a46;--ac:#7fb0e6;--ac-s:rgba(127,176,230,.14);--au:#d9b25e;--au-s:rgba(217,178,94,.16);--ok:#58c487;--ok-s:rgba(88,196,135,.14);--wr:#e8a05a;--wr-s:rgba(232,160,90,.14);--bad:#f07167;--bad-s:rgba(240,113,103,.14);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181f;--sf:#1d232c;--sf2:#222a35;--tx:#e9edf3;--mu:#a4adbb;--fa:#7d8796;--bd:#323a46;--ac:#7fb0e6;--ac-s:rgba(127,176,230,.14);--au:#d9b25e;--au-s:rgba(217,178,94,.16);--ok:#58c487;--ok-s:rgba(88,196,135,.14);--wr:#e8a05a;--wr-s:rgba(232,160,90,.14);--bad:#f07167;--bad-s:rgba(240,113,103,.14);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:1120px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:21px;margin:6px 0 2px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13px;margin:14px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--mu);margin:0 0 14px}
a{color:var(--ac)}
section.card,.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;min-width:0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mu);gap:3px;min-width:0}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac-s);border-color:var(--ac)}
button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:7px;padding:6px 11px;white-space:nowrap}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-theme="dark"] button.p{color:#0d1520}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#0d1520}}
button.l{border:0;background:none;color:var(--ac);padding:2px 4px;text-decoration:underline}
button.x{color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.bar>label{flex:1 1 160px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:4px 0 14px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mu);padding:9px 12px;font-weight:500}
.tabs button.on{color:var(--tx);border-color:var(--au);font-weight:650}
.pane{display:none}.pane.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border-radius:20px}
.chips button.on{background:var(--ac-s);border-color:var(--ac);font-weight:600}
.chips button small{color:var(--fa);margin-left:4px;font-weight:400}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.k{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--sf2);min-width:0}
.k.main{border-color:var(--au);background:var(--au-s)}
.k .lb{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.k .v{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.k .s{font-size:12.5px;color:var(--mu)}
.k .s b{color:var(--tx);font-weight:600}
.rng{display:flex;justify-content:space-between;gap:6px;margin-top:4px}
.rng div{text-align:center;flex:1}.rng div b{display:block;font-size:15px}.rng small{color:var(--fa);font-size:11px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:2px 9px;border:1px solid}
.badge.alta{color:var(--ok);background:var(--ok-s);border-color:var(--ok)}
.badge.media{color:var(--ac);background:var(--ac-s);border-color:var(--ac)}
.badge.baja{color:var(--wr);background:var(--wr-s);border-color:var(--wr)}
.pill{display:inline-block;font-size:11px;border-radius:20px;padding:1px 8px;background:var(--sf2);border:1px solid var(--bd);color:var(--mu);margin:2px 3px 2px 0}
.pill.w{background:var(--wr-s);border-color:var(--wr);color:var(--wr)}
.pill.b{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.pill.o{background:var(--ok-s);border-color:var(--ok);color:var(--ok)}
.reasons{margin:8px 0 0;padding-left:18px;color:var(--mu);font-size:12.5px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:6px;border-bottom:1px solid var(--bd);white-space:nowrap;vertical-align:bottom}
td{padding:6px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:13px}
td.n,th.n{text-align:right;white-space:nowrap}
td small,.mut{color:var(--fa);font-size:11.5px}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}.zero{color:var(--fa)}
.wf{margin-top:6px}
.wf .r{display:grid;grid-template-columns:170px minmax(0,1fr) 120px;gap:10px;align-items:center;padding:4px 0}
.wf .r .t{font-size:12.5px;line-height:1.2}
.wf .r .t small{display:block;color:var(--fa);font-size:11px}
.wf .r .trk{position:relative;height:18px;background:var(--sf2);border-radius:4px}
.wf .r .trk i{position:absolute;top:2px;bottom:2px;border-radius:3px}
.wf .r .vv{text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap}
.wf .r .vv small{display:block;font-weight:500;font-size:11px}
.wf .r.tot .t{font-weight:700}
.wf .why{grid-column:1/-1;font-size:11.5px;color:var(--mu);margin:-2px 0 2px 180px}
.comp{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--sf2)}
.comp.out{opacity:.6}
.comp .hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.comp .hd b{font-size:14px}
.comp .hd .adj{margin-left:auto;font-weight:700}
.comp .g{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.comp label{font-size:10.5px}
.comp input,.comp select{padding:5px 6px;font-size:12.5px;background:var(--sf)}
.note{font-size:12px;color:var(--wr);margin-top:6px}
.fx td input{width:84px}
.fx td textarea{min-height:32px;font-size:12.5px}
.src li{margin-bottom:6px}
.src .st{font-size:11px}
.hint{color:var(--mu);font-size:12.5px;margin:0 0 10px}
.lib td b{font-size:13.5px}
.empty{color:var(--mu);padding:14px;text-align:center;border:1px dashed var(--bd);border-radius:10px}
#print{display:none}
@media (max-width:760px){.kpi{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:minmax(0,1fr)}.wf .r{grid-template-columns:110px minmax(0,1fr) 96px}.wf .why{margin-left:0}main{padding:12px 12px 50px}h1{font-size:18px}}
@media print{
  @page{size:letter;margin:12mm}
  body{background:#fff;color:#111;font-size:11px}
  main{display:none}
  #print{display:block}
  #print h1{font-size:17px}#print h2{font-size:13px;margin:12px 0 6px}
  #print table{font-size:10px}#print th,#print td{padding:3px 4px;border-bottom:1px solid #ccc;color:#111}
  #print .k{border:1px solid #bbb;background:#fff;padding:7px 8px}#print .k.main{border-color:#8a6a1e}
  #print .kpi{grid-template-columns:1fr 1fr 1.5fr;gap:6px}#print .k .v{font-size:17px}#print .rng div b{font-size:12px}#print .rng small{font-size:9px}
  #print .sc{overflow:visible}#print th{font-size:8px;white-space:normal;letter-spacing:.03em}#print .lib td{font-size:9.5px}#print .lib td b{font-size:10.5px}#print .lib small{font-size:8.5px}
  #print .card{padding:8px;border-color:#ccc}#print .badge{color:#111;background:#fff;border-color:#555}
  #print .wf .r .trk{background:#eee}
  #print .sheet{page-break-after:always}
  #print .sheet:last-child{page-break-after:auto}
  #print a{color:#111;text-decoration:none}
}
</style></head><body><main>
<h1>Valuador de camiones y tractocamiones usados · Libro azul</h1>
<p class="sub">Valores de mercado y de compra por subproyecto, con comparables normalizados a la unidad y premios o penalizaciones justificados.</p>

<section class="card">
  <div class="bar">
    <label style="flex:2 1 220px">Subproyecto<select id="pSel"></select></label>
    <button id="pNew">Nuevo</button><button id="pDup">Duplicar</button><button id="pDel" class="x">Eliminar</button>
    <button id="pExp">Exportar JSON</button><button id="pImp">Importar JSON</button><input type="file" id="pFile" accept="application/json,.json" hidden>
  </div>
  <div class="g" style="margin-top:10px">
    <label>Nombre<input id="pName"></label><label>Cliente<input id="pClient"></label><label>Fecha<input type="date" id="pDate"></label>
    <label style="grid-column:span 2">Notas<input id="pNotes" placeholder="Alcance, contacto, condiciones"></label>
  </div>
</section>

<div class="tabs" id="tabs">
  <button data-t="units" class="on">Unidades</button><button data-t="book">Libro azul</button><button data-t="cfg">Factores y justificaciones</button><button data-t="src">Fuentes de consulta</button>
</div>

<div class="pane on" id="t-units">
  <div class="chips" id="uChips"></div>
  <div id="uBody"></div>
</div>
<div class="pane" id="t-book"><div id="book"></div></div>
<div class="pane" id="t-cfg"><div id="cfg"></div></div>
<div class="pane" id="t-src"><div id="srcs"></div></div>
</main>
<div id="print"></div>
<script>
(function(){
"use strict";
var KEY = "valuador-libroazul-v2", OLD = "valcam1";
var YR = new Date().getFullYear();
var SUP = "supuesto, calibrar";

/* ---------- catálogos con factor (%), justificación y fuente ---------- */
function o(f, why, src){ return {f:f, why:why, src:src||SUP}; }
var DEF = {
  iva: 16, fx: 18.5, trim: 30, margen: 10, recon: 0,
  dep: o(7, "Depreciación anual típica de tracto carretero en México; varía por marca y demanda."),
  km: o(1.5, "Desgaste de motor y tren motriz; el comprador castiga el km alto aunque haya reparaciones."),
  newDrop: o(15, "Pérdida al salir de agencia (descuentos, garantía, financiamiento) al usar el precio de lista nuevo como ancla."),
  cats: {
    motor: { lab: "Motor", opts: {
      "Cummins X15 / ISX": o(100, "Referencia: el más común en tractos usados; refacciones y talleres en todo el país; mejor reventa."),
      "International S13": o(95, "Motor nuevo en México (2022 en adelante): historial corto y refacciones solo en red International."),
      "Detroit DD13": o(96, "13 litros: menos torque para full y montaña; menor demanda que los motores de 15 litros."),
      "Detroit DD15": o(100, "15 litros con buena aceptación en flotillas; red Daimler extendida."),
      "Detroit DD16": o(101, "Mayor potencia para carga pesada; poca oferta en usados."),
      "Paccar MX-13": o(98, "Bien aceptado en Kenworth; refacciones sobre todo en red Kenworth."),
      "Volvo D13": o(95, "Red de servicio más concentrada; menor aceptación fuera de flotillas Volvo."),
      "Cummins ISM / ISL": o(92, "Generación anterior o menor cilindrada para tracto carretero."),
      "International A26": o(94, "Motor propio anterior al S13; aceptación media."),
      "Navistar MaxxForce / N13": o(80, "Historial de fallas (EGR); castigo fuerte en reventa."),
      "Otro": o(92, "Motor poco común: refacciones y reventa inciertas.")
    }},
    trans: { lab: "Transmisión", opts: {
      "Fuller manual 18 vel.": o(100, "Referencia en México para full y montaña; operadores la conocen; reparación barata en cualquier taller."),
      "Fuller manual 13 vel.": o(98, "Versátil; algo menos buscada que la de 18 para doble remolque."),
      "Fuller manual 10 vel.": o(94, "Menos pasos: limita el desempeño cargado en montaña."),
      "International T14 (automatizada)": o(96, "Automatizada nueva con historial corto en México; reparación en red International."),
      "Detroit DT12 (automatizada)": o(98, "Automatizada con buena aceptación en flotillas; ahorra combustible; reparación especializada."),
      "Eaton Endurant (automatizada)": o(98, "Automatizada moderna bien aceptada; reparación especializada."),
      "Eaton UltraShift / UltraShift PLUS": o(94, "Generación anterior; reparaciones de embrague y actuadores costosas."),
      "Volvo I-Shift": o(96, "Buena en flotillas Volvo; reparación en red Volvo."),
      "Allison (automática)": o(93, "Automática de convertidor, más vocacional; poco buscada en tracto carretero."),
      "Otra": o(92, "Transmisión poco común: reventa incierta.")
    }},
    hp: { lab: "Potencia", opts: {
      "Menos de 400 HP": o(92, "Insuficiente para full cargado en montaña."),
      "400–449 HP": o(97, "Suficiente en plano; limitada con full en montaña."),
      "450–474 HP": o(100, "Referencia: rango más común en tracto carretero mexicano."),
      "475–499 HP": o(101, "Mejor desempeño cargado y en montaña."),
      "500 HP o más": o(102, "Premio por desempeño; el mayor consumo limita el premio.")
    }},
    ratio: { lab: "Relación de diferencial", opts: {
      "3.08 o menos": o(95, "Muy rápida (downspeed): ahorra combustible en plano, limitada en montaña y con full."),
      "3.09–3.42": o(97, "Orientada a carretera plana y consumo."),
      "3.43–3.70": o(99, "Equilibrio entre carretera y montaña."),
      "3.71–4.10": o(100, "Referencia: versátil para full y montaña; la más buscada en usados en México."),
      "Más de 4.10": o(98, "Carga pesada o vocacional; más consumo en carretera.")
    }},
    diff: { lab: "Capacidad del diferencial", opts: {
      "Menos de 40,000 lb": o(90, "Limita el peso bruto; poco apto para full."),
      "40,000 lb": o(96, "Limita la carga con full; el comprador mexicano prefiere 46,000 lb."),
      "44,000–46,000 lb": o(100, "Referencia: estándar de tracto para full en México."),
      "Más de 46,000 lb": o(100, "Pesado o vocacional; sin premio en carretera.")
    }},
    rims: { lab: "Rines", opts: {
      "24.5": o(100, "Referencia: estándar carretero en México (llanta 11R24.5)."),
      "22.5": o(98, "Llanta de perfil bajo: menos altura y peso; algo menos aceptada por compradores de carga pesada."),
      "19.5": o(90, "Medida de camión mediano; no usual en tracto.")
    }},
    cab: { lab: "Cabina", opts: {
      "Day cab (sin dormitorio)": o(90, "No apta para largo recorrido con operador a bordo; demanda regional."),
      "Dormitorio hasta 48\"": o(97, "Dormitorio corto: comodidad limitada en viajes largos."),
      "Dormitorio 52–60\"": o(100, "Referencia: medida más común en tracto carretero mexicano."),
      "Dormitorio 62–72\"": o(102, "Más comodidad para viajes largos y relevo; más peso y consumo."),
      "Dormitorio 76\" o más": o(102, "Alta comodidad; más peso; premio limitado.")
    }},
    config: { lab: "Configuración", opts: {
      "6x4": o(100, "Referencia: estándar para full y montaña."),
      "6x2": o(92, "Menos tracción en montaña; poca aceptación en México."),
      "4x2": o(88, "Solo para sencillo y carga ligera; demanda menor."),
      "8x4": o(95, "Vocacional; mercado distinto al tracto carretero.")
    }},
    cond: { lab: "Estado general", opts: {
      "Excelente": o(103, "Sin reparaciones pendientes y llantas con más de 70 %."),
      "Bueno": o(100, "Referencia: lista para trabajar."),
      "Regular": o(92, "Reparaciones menores y llantas por cambiar."),
      "Para reparar": o(80, "Reparación mayor pendiente.")
    }}
  },
  srcTypes: {
    "Anuncio México": {w:1.0, why:"Precio pedido en portal; puede bajar al negociar."},
    "Distribuidor / seminuevo certificado": {w:1.0, why:"Unidad revisada con ficha; precio pedido."},
    "Venta de flotilla": {w:0.9, why:"Lote homogéneo; puede traer descuento por volumen."},
    "Redes sociales": {w:0.8, why:"Información incompleta y verificación limitada."},
    "Subasta / remate": {w:0.8, why:"Precio de liquidación: referencia de piso."},
    "Guía de precios": {w:0.7, why:"Valor estadístico de un portal o guía; no es una unidad concreta."},
    "Referencia EUA / extranjera": {w:0.6, why:"Otro mercado: sin IVA mexicano, importación ni adecuaciones."},
    "Precio de lista nuevo": {w:1.0, why:"Ancla del valor; se le aplica la pérdida inicial de unidad nueva."}
  }
};
var FACT = ["motor","trans","hp","ratio","diff","rims","cab","config"];
var ESTADOS = ["Verificado","Por verificar","Captura manual"];

/* ---------- bandas ---------- */
function hpBand(h){ h=+h; if(!h) return ""; return h<400?"Menos de 400 HP":h<450?"400–449 HP":h<475?"450–474 HP":h<500?"475–499 HP":"500 HP o más"; }
function ratioBand(r){ r=+r; if(!r) return ""; return r<=3.08?"3.08 o menos":r<=3.42?"3.09–3.42":r<=3.70?"3.43–3.70":r<=4.10?"3.71–4.10":"Más de 4.10"; }
function diffBand(d){ d=+d; if(!d) return ""; return d<40000?"Menos de 40,000 lb":d<44000?"40,000 lb":d<=46000?"44,000–46,000 lb":"Más de 46,000 lb"; }
function cabBand(t, s){ if(!t) return ""; if(t==="day") return "Day cab (sin dormitorio)"; s=+s; if(!s) return ""; return s<=48?"Dormitorio hasta 48\"":s<=60?"Dormitorio 52–60\"":s<=72?"Dormitorio 62–72\"":"Dormitorio 76\" o más"; }
function key(x, k){
  if(!x) return "";
  if(k==="hp") return hpBand(x.hp); if(k==="ratio") return ratioBand(x.ratio); if(k==="diff") return diffBand(x.diff);
  if(k==="cab") return cabBand(x.cabType, x.cabSize); return x[k] || "";
}

/* ---------- estado ---------- */
var S = null;
function clone(v){ return JSON.parse(JSON.stringify(v)); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function blankUnit(n){ return {id:uid(), name:n||"Unidad nueva", year:YR-3, yearNote:"", km:500000, config:"6x4", cabType:"dorm", cabSize:56, hp:450, motor:"Cummins X15 / ISX", trans:"Fuller manual 18 vel.", ratio:3.73, diff:46000, rims:"24.5", cond:"Bueno", margen:null, recon:null, refYears:"", comps:[]}; }

  Object.keys(c.srcTypes||{}).forEach(function(k){ d.srcTypes[k]=Object.assign(d.srcTypes[k]||{w:1,why:""}, c.srcTypes[k]); });

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function fm(n){ return (n==null||!isFinite(n))?"—":n.toLocaleString("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}); }
function fk(n){ return n?(+n).toLocaleString("es-MX")+" km":"km s/d"; }
function pc(x,d){ var v=(x-1)*100; return (v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d==null?1:d)+" %"; }
function cls(x){ return Math.abs(x-1)<0.0005?"zero":x>1?"pos":"neg"; }
function opts(list, v, blank){ return (blank?'<option value="">'+blank+'</option>':"")+list.map(function(k){ return '<option'+(String(k)===String(v)?" selected":"")+'>'+esc(k)+'</option>'; }).join(""); }
function proj(){ return S.projects.find(function(p){ return p.id===S.active; }) || S.projects[0]; }
function unit(p){ p=p||proj(); var u=p.units.find(function(x){ return x.id===p.active; }); if(!u){ u=p.units[0]; if(u) p.active=u.id; } return u; }
function cat(k){ return S.cfg.cats[k]; }
function fac(k, kx){ var o2 = cat(k).opts[kx]; return o2 ? o2.f/100 : 1; }
function ivaR(){ return S.cfg.iva/100; }
function mg(u){ return (u.margen!=null&&u.margen!=="")?+u.margen:S.cfg.margen; }
function rc(u){ return (u.recon!=null&&u.recon!=="")?+u.recon:S.cfg.recon; }

/* ---------- valuación ---------- */
function kmF(km){ return Math.max(.4, 1 - S.cfg.km.f/100*(+km||0)/1e5); }
function compBase(c){ // precio con IVA, en MXN, antes de ajustes de especificación
  var p = (+c.price||0) * (c.cur==="USD" ? S.cfg.fx : 1);
  if(c.ivaMode==="mas") p *= 1+ivaR();
  if(c.srcType==="Precio de lista nuevo") p *= 1 - S.cfg.newDrop.f/100;
  return p;
}
function weight(c){ var t=S.cfg.srcTypes[c.srcType]; var w=(c.w!=null&&c.w!=="")?+c.w:(t?t.w:1); return Math.max(0,w); }
function usable(c){ return c.status!=="Captura manual" && +c.price>0 && +c.year>0; }
function ratios(u, c){ // factor por concepto: unidad / comparable (un dato faltante cuenta como igual)
  var r = {}, dep = 1 - S.cfg.dep.f/100;
  r.anio = Math.pow(dep, (+c.year) - (+u.year));
  r.km = (c.km!=null && c.km!=="" && c.srcType!=="Precio de lista nuevo") ? kmF(u.km)/kmF(c.km) : (c.srcType==="Precio de lista nuevo" ? kmF(u.km)/kmF(0) : 1);
  FACT.forEach(function(k){ var a=key(u,k), b=key(c,k); r[k] = (a && b) ? fac(k,a)/fac(k,b) : 1; });
  return r;
}
function quant(xs, q){ if(!xs.length) return null; var s=xs.slice().sort(function(a,b){return a-b}), pos=(s.length-1)*q, lo=Math.floor(pos), hi=Math.ceil(pos); return s[lo]+(s[hi]-s[lo])*(pos-lo); }
function valuate(u){
  var R = {rows:[], inc:[], masIva:[]};
  (u.comps||[]).forEach(function(c){
    var row = {c:c, ok:usable(c)};
    if(c.ivaMode==="mas") R.masIva.push(c);
    if(row.ok){ row.base = compBase(c); row.r = ratios(u,c); row.adj = row.base; Object.keys(row.r).forEach(function(k){ row.adj *= row.r[k]; }); row.w = weight(c); }
    R.rows.push(row);
  });
  var ok = R.rows.filter(function(x){ return x.ok && x.w>0; });
  var m = quant(ok.map(function(x){ return x.adj; }), .5);
  ok.forEach(function(x){ x.out = S.cfg.trim>0 && m && Math.abs(x.adj-m) > S.cfg.trim/100*m; if(!x.out) R.inc.push(x); });
  R.median = m;
  if(!R.inc.length) return R;
  var W = R.inc.reduce(function(s,x){ return s+x.w; },0);
  var mean = R.inc.reduce(function(s,x){ return s+x.w*x.adj; },0)/W;
  var condF = fac("cond", u.cond||"Bueno");
  var vals = R.inc.map(function(x){ return x.adj; });
  R.W=W; R.condF=condF;
  R.mid = mean*condF;
  R.low = (R.inc.length>=4 ? quant(vals,.25) : Math.min.apply(null,vals))*condF;
  R.high = (R.inc.length>=4 ? quant(vals,.75) : Math.max.apply(null,vals))*condF;
  if(R.low>R.mid) R.low=R.mid; if(R.high<R.mid) R.high=R.mid;
  var t=1+ivaR(); R.midS=R.mid/t; R.lowS=R.low/t; R.highS=R.high/t;
  R.buyS = Math.max(0, R.midS*(1-mg(u)/100) - rc(u)); R.buy = R.buyS*t;
  // cascada: base ponderada y efecto promedio de cada concepto
  R.base = R.inc.reduce(function(s,x){ return s+x.w*x.base; },0)/W;
  var run = R.base, steps=[];
  ["anio","km"].concat(FACT).forEach(function(k){
    var g = Math.exp(R.inc.reduce(function(s,x){ return s+x.w*Math.log(x.r[k]); },0)/W);
    steps.push({k:k, f:g, from:run, to:run*g}); run*=g;
  });
  R.steps = steps; R.mix = mean/run; R.preCond = mean;
  R.conf = confidence(u, R);
  return R;
}
function confidence(u, R){
  var inc=R.inc, n=inc.length, W=R.W, why=[];
  var gap = inc.reduce(function(s,x){ return s + x.w*Math.abs((+x.c.year)-(+u.year)); },0)/W;
  var attrs = ["motor","trans","hp","ratio","cab","config"], m=0, tot=0, sinDato=0;
  inc.forEach(function(x){ attrs.forEach(function(k){ var a=key(u,k), b=key(x.c,k); if(!a) return; tot++; if(!b){ sinDato++; m+=.5; } else if(a===b) m++; }); });
  var spec = tot? m/tot : 0;
  var mx = inc.reduce(function(s,x){ return s + ((x.c.srcType==="Referencia EUA / extranjera"||x.c.srcType==="Precio de lista nuevo")?0:x.w); },0)/W;
  var pts = (n>=6?2:n>=3?1:0) + (gap<=1?2:gap<=3?1:0) + (spec>=.7?2:spec>=.5?1:0) + (mx>=.7?2:mx>=.4?1:0);
  var lvl = n<2 ? "baja" : pts>=7 ? "alta" : pts>=4 ? "media" : "baja";
  why.push(n+" comparable"+(n===1?"":"s")+" usado"+(n===1?"":"s")+(R.rows.length-n?" ("+(R.rows.length-n)+" excluido"+(R.rows.length-n===1?"":"s")+" o sin precio)":""));
  why.push("Diferencia media de año modelo: "+gap.toFixed(1)+" años");
  why.push("Coincidencia de especificación: "+Math.round(spec*100)+" %"+(sinDato?" ("+sinDato+" datos sin informar)":""));
  why.push("Peso de fuentes mexicanas: "+Math.round(mx*100)+" % (EUA y precio de lista pesan menos)");
  return {lvl:lvl, why:why, gap:gap, spec:spec, mx:mx};
}

var NOMBRE = {anio:"Año modelo", km:"Kilometraje", motor:"Motor", trans:"Transmisión", hp:"Potencia", ratio:"Relación de diferencial", diff:"Capacidad del diferencial", rims:"Rines", cab:"Cabina", config:"Configuración"};
function stepWhy(k){ if(k==="anio") return S.cfg.dep.why; if(k==="km") return S.cfg.km.why; return ""; }
function unitWhy(u,k,R){

  var kx=key(u,k), op=cat(k).opts[kx]; if(!op) return "Sin dato en la unidad: no se ajusta.";
  var otros={}; (R&&R.inc||[]).forEach(function(x){ var b=key(x.c,k); if(b&&b!==kx) otros[b]=(otros[b]||0)+1; });
  var l=Object.keys(otros).map(function(b){ return b+" ("+otros[b]+", "+(cat(k).opts[b]?cat(k).opts[b].f:100)+" %)"; });
  return "Unidad: "+kx+" ("+op.f+" %). "+op.why+(l.length?" Comparables ajustados: "+l.join("; ")+".":"");
}
function waterfall(u, R, mode){
  if(!R.mid) return "";
  var t = mode==="sin" ? 1+ivaR() : 1;
  var rows = [{l:"Precio base de comparables", s:"Promedio ponderado normalizado a precio con IVA", v:R.base/t, tot:true}];
  R.steps.forEach(function(s){ if(Math.abs(s.f-1)<0.0005) return; rows.push({l:NOMBRE[s.k], s:pc(s.f)+" promedio", from:s.from/t, to:s.to/t, f:s.f, why:unitWhy(u,s.k,R)}); });
  if(Math.abs(R.mix-1)>=0.0005){ var a=R.preCond/R.mix/t; rows.push({l:"Efecto de mezcla", s:"Diferencia entre promedio de productos y producto de promedios", from:a, to:R.preCond/t, f:R.mix, why:"Ajuste técnico por combinar varios comparables; no es premio ni penalización."}); }
  if(Math.abs(R.condF-1)>=0.0005) rows.push({l:"Estado general", s:pc(R.condF)+" · "+u.cond, from:R.preCond/t, to:R.mid/t, f:R.condF, why:cat("cond").opts[u.cond]?cat("cond").opts[u.cond].why:""});
  rows.push({l:"Valor de mercado", s:"Medio", v:R.mid/t, tot:true});
  var marg = R.midS*mg(u)/100;
  rows.push({l:"Margen "+mg(u)+" %", s:"Utilidad deseada", from:R.mid/t, to:(R.midS-marg)*(mode==="sin"?1:1+ivaR()), f:0, why:"Margen de reventa definido para la unidad."});
  if(rc(u)) rows.push({l:"Reacondicionamiento", s:fm(rc(u))+" sin IVA", from:(R.midS-marg)*(mode==="sin"?1:1+ivaR()), to:(mode==="sin"?R.buyS:R.buy), f:0, why:"Costo estimado para dejar la unidad vendible."});
  rows.push({l:"Precio sugerido de compra", s:mode==="sin"?"sin IVA":"con IVA", v:mode==="sin"?R.buyS:R.buy, tot:true, gold:true});

function factorTable(u, R){

  FACT.concat(["cond"]).forEach(function(k){ var kx = k==="cond" ? u.cond : key(u,k), op=cat(k).opts[kx];
    rows.push([k, cat(k).lab, kx||"Sin dato", op?op.f/100:1, op?op.why:"Sin dato: no se ajusta.", op?op.src:"—", ""]); });

    rows.map(function(r){ var e=eff[r[0]]; return '<tr><td>'+r[1]+'</td><td>'+esc(r[2])+'</td><td class="n '+cls(r[3])+'">'+pc(r[3])+(r[6]?'<br><small>'+esc(r[6])+'</small>':"")+'</td><td class="n '+(e?cls(e):"zero")+'">'+(e?pc(e):"—")+'</td><td>'+esc(r[4])+'</td><td><small>'+esc(r[5])+'</small></td></tr>'; }).join("")+'</tbody></table></div>'+
